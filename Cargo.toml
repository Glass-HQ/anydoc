[workspace]
members = ["node", "python", "wasm"]
# cargo-fuzz keeps its own lockfile and nightly-only dependencies.
exclude = ["fuzz"]

[package]
name = "anydoc"
version = "0.2.4"
edition = "2024"
# Edition 2024 needs 1.85; zip raises it to 1.88.
rust-version = "1.88"
description = "Convert documents (doc, docx, odt, rtf, epub, pdf, presentations, spreadsheets, csv) to GitHub-Flavored Markdown"
license = "MIT"
repository = "https://github.com/firecrawl/anydoc"
readme = "README.md"
keywords = ["markdown", "docx", "pdf", "converter", "document"]
categories = ["parser-implementations", "text-processing"]
include = ["/src", "/examples/convert.rs", "/README.md", "/LICENSE", "/NOTICE"]

[dev-dependencies]
insta = "1"
sha2 = "0.11"

[dependencies]
cfb = "0.14.0"
csv = "1.4.0"
flate2 = "1"
encoding_rs = "0.8.35"
log = "0.4"
pdf-inspector = { version = "1.14.2", optional = true }
quick-xml = "0.41.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[features]
default = ["pdf"]
# PDF to Markdown through pdf-inspector, by far the largest dependency. Without
# it every other format still converts, and PDFs report `Unsupported`.
pdf = ["dep:pdf-inspector"]

[profile.release]
lto = "thin"
strip = "symbols"
